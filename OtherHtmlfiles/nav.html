<!-- AUTH MODAL -->
<div class="auth-modal" id="authModal">
  <div class="auth-container">

    <span class="close-auth" id="closeAuth">&times;</span>

<!-- LOGIN FORM -->
 <form class="form login-form active" id="loginForm">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit" class="auth-btn">Login</button>
    <p>Don't have an account?
        <span id="switchToRegister">Register</span>
    </p>
</form>

<!-- REGISTER FORM -->
 <form class="form register-form" id="registerForm">
    <h2>Register</h2>
    <input type="text" id="regName" placeholder="Full Name" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <input type="password" id="regConfirm" placeholder="Confirm Password" required>
    <button type="submit" class="auth-btn">Register</button>
    <p>Already have an account?
        <span id="switchToLogin">Login</span>
    </p>
</form>
